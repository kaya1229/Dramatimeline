<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drama Line: Vertical Receipt</title>
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #e5e7eb; --receipt: #fdfdfb; --ink: #1a1a1a; --red: #ff4b4b; }
        body { font-family: 'Courier Prime', 'Noto Sans KR', monospace; background: var(--bg); display: flex; flex-direction: column; align-items: center; padding: 20px; margin: 0; color: var(--ink); }
        
        .receipt { width: 100%; max-width: 420px; background: var(--receipt); padding: 40px 25px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); position: relative; clip-path: polygon(0% 1%, 5% 0%, 10% 1%, 15% 0%, 20% 1%, 25% 0%, 30% 1%, 35% 0%, 40% 1%, 45% 0%, 50% 1%, 55% 0%, 60% 1%, 65% 0%, 70% 1%, 75% 0%, 80% 1%, 85% 0%, 90% 1%, 95% 0%, 100% 1%, 100% 99%, 95% 100%, 90% 99%, 85% 100%, 80% 99%, 75% 100%, 70% 99%, 65% 100%, 60% 99%, 55% 100%, 50% 99%, 45% 100%, 40% 99%, 35% 100%, 30% 99%, 25% 100%, 20% 99%, 15% 100%, 10% 99%, 5% 100%, 0% 99%); }
        .header { text-align: center; border-bottom: 2px dashed #ccc; padding-bottom: 15px; margin-bottom: 20px; }
        input { width: 100%; border: none; border-bottom: 1px solid #ddd; background: transparent; padding: 10px 0; font-family: inherit; margin-bottom: 15px; outline: none; }
        
        /* 세로 스크롤 영역 */
        .canvas-container { position: relative; width: 100%; height: 400px; overflow-y: auto; border: 1px solid var(--ink); background: white; margin-top: 10px; }
        canvas { display: block; cursor: crosshair; }
        
        /* 판독 도장 스타일 */
        #verdict-stamp { display: none; text-align: center; font-weight: bold; border: 3px double var(--red); color: var(--red); padding: 5px; transform: rotate(-5deg); margin: 15px 0; font-size: 1.2rem; }

        .btn { background: var(--ink); color: white; border: none; padding: 12px; cursor: pointer; font-family: inherit; width: 100%; font-weight: bold; margin-top: 10px; }
        .archive-item { border-bottom: 1px dotted #ccc; padding: 8px 0; font-size: 0.8rem; cursor: pointer; }
        .archive-item:hover { background: #f1f1f1; }
        #search-results { list-style: none; padding: 0; background: white; border: 1px solid #eee; display: none; }
        #search-results li { padding: 10px; border-bottom: 1px dotted #ccc; cursor: pointer; font-size: 0.8rem; }
    </style>
</head>
<body>

<div class="receipt">
    <div class="header">
        <h1>DRAMA LINE</h1>
        <p style="font-size: 0.7rem;">VERTICAL CRITIC REPORT</p>
    </div>

    <div id="auth-section">
        <input type="text" id="nick" placeholder="NICKNAME">
        <input type="password" id="pw" placeholder="PIN (4 DIGITS)">
        <button class="btn" onclick="login()">ENTER</button>
    </div>

    <div id="main-section" style="display:none;">
        <div style="font-size: 0.75rem; margin-bottom: 10px;">
            CASHER: <b id="user-name"></b> | DATE: <span id="date"></span>
        </div>

        <input type="text" id="search" placeholder="SEARCH OR ADD TITLE..." oninput="searchDrama()">
        <ul id="search-results"></ul>

        <div id="editor-section" style="display:none;">
            <div style="display:flex; justify-content: space-between; font-weight:bold; font-size: 0.9rem;">
                <span id="target-title">TITLE</span>
                <span id="target-eps">00 EPS</span>
            </div>
            
            <div class="canvas-container">
                <canvas id="chartCanvas"></canvas>
            </div>
            
            <div id="verdict-stamp">용두사미 판독중...</div>
            <button class="btn" onclick="save()">PRINT & SAVE</button>
        </div>

        <button class="btn" style="background:none; color:var(--ink); border:1px solid var(--ink); font-size:0.7rem;" onclick="toggleArchive()">VIEW ARCHIVE ▼</button>
        <div id="archive-list" style="display:none; margin-top:10px;"></div>
        <p onclick="logout()" style="font-size: 0.6rem; text-align:right; color:#999; cursor:pointer; margin-top:20px;">LOGOUT</p>
    </div>
</div>

<script>
    const dramaDB = [ {title:"창란결", eps:36}, {title:"더 글로리", eps:16}, {title:"강철삼림", eps:24} ];
    let user = JSON.parse(localStorage.getItem('dl_u')) || null;
    let currentDrama = null;
    let points = []; 
    const stepY = 40; // 세로 간격 고정
    const canvas = document.getElementById('chartCanvas');
    const ctx = canvas.getContext('2d');

    if(user) showMain();

    function login() {
        const n = document.getElementById('nick').value;
        const p = document.getElementById('pw').value;
        if(!n || p.length < 4) return alert("필수 정보를 입력하세요.");
        user = {n, p}; localStorage.setItem('dl_u', JSON.stringify(user));
        showMain();
    }

    function showMain() {
        document.getElementById('auth-section').style.display='none';
        document.getElementById('main-section').style.display='block';
        document.getElementById('user-name').innerText = user.n;
        document.getElementById('date').innerText = new Date().toLocaleDateString();
        loadArchive();
    }

    function searchDrama() {
        const q = document.getElementById('search').value.trim();
        const res = document.getElementById('search-results');
        if(!q) return res.style.display='none';
        const filtered = dramaDB.filter(d => d.title.includes(q));
        let html = filtered.map(d => `<li onclick="initCanvas('${d.title}', ${d.eps})">${d.title} (${d.eps}화)</li>`).join('');
        if(!filtered.length) html = `<li onclick="addManual('${q}')">+ '${q}' 직접 추가하기</li>`;
        res.innerHTML = html; res.style.display='block';
    }

    function addManual(t) {
        const e = prompt("몇 부작인가요?", "16");
        if(e) initCanvas(t, parseInt(e));
    }

    function initCanvas(title, eps, savedPoints = null) {
        currentDrama = {title, eps};
        document.getElementById('search-results').style.display='none';
        document.getElementById('editor-section').style.display='block';
        document.getElementById('target-title').innerText = title.toUpperCase();
        document.getElementById('target-eps').innerText = eps + " EPS";
        document.getElementById('verdict-stamp').style.display = 'none';

        canvas.width = 350; 
        canvas.height = (eps + 1) * stepY;
        points = savedPoints || new Array(eps).fill(null);
        draw();
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        // 1. 배경 가이드선 & 회차 번호
        ctx.font = "10px Courier Prime";
        ctx.fillStyle = "#ccc";
        for(let i=1; i<=currentDrama.eps; i++) {
            const py = i * stepY;
            ctx.fillText(i.toString().padStart(2, '0'), 10, py + 4);
            ctx.beginPath(); ctx.moveTo(40, py); ctx.lineTo(canvas.width, py);
            ctx.strokeStyle = "#f1f1f1"; ctx.stroke();
        }
        // 2. 중앙 기준선
        ctx.setLineDash([5, 5]);
        ctx.beginPath(); ctx.moveTo(canvas.width/2 + 20, 0); ctx.lineTo(canvas.width/2 + 20, canvas.height);
        ctx.strokeStyle = "#ddd"; ctx.stroke(); ctx.setLineDash([]);

        // 3. 선 & 도트
        ctx.beginPath(); ctx.strokeStyle = "#1a1a1a"; ctx.lineWidth = 2;
        let first = true;
        points.forEach((x, i) => {
            if(x !== null) {
                const py = (i+1) * stepY;
                if(first) { ctx.moveTo(x, py); first = false; }
                else ctx.lineTo(x, py);
            }
        });
        ctx.stroke();

        points.forEach((x, i) => {
            if(x !== null) {
                ctx.fillStyle = x > canvas.width/2 + 20 ? "#1a1a1a" : "#ff4b4b";
                ctx.fillRect(x-3, (i+1)*stepY-3, 6, 6);
            }
        });
    }

    canvas.addEventListener('mousedown', (e) => {
        const rect = canvas.getBoundingClientRect();
        const y = (e.clientY - rect.top) * (canvas.height / rect.height);
        const x = (e.clientX - rect.left) * (canvas.width / rect.width);
        const idx = Math.round(y / stepY) - 1;
        if(idx >= 0 && idx < currentDrama.eps) {
            points[idx] = x; draw(); updateVerdict();
        }
    });

    function updateVerdict() {
        const valid = points.filter(p => p !== null);
        if(valid.length < 2) return;
        const start = valid[0]; const end = valid[valid.length-1];
        const mid = canvas.width / 2 + 20;
        let res = "";
        if(start > mid && end > mid) res = "용두용미 (BEST)";
        else if(start > mid && end <= mid) res = "용두사미 (WORST)";
        else if(start <= mid && end > mid) res = "사두용미 (REVERSE)";
        else res = "사두사미 (CONSISTENT)";
        
        const stamp = document.getElementById('verdict-stamp');
        stamp.innerText = res; stamp.style.display = 'block';
    }

    function save() {
        const db = JSON.parse(localStorage.getItem(`db_${user.n}`)) || [];
        const idx = db.findIndex(i => i.title === currentDrama.title);
        const data = { title: currentDrama.title, eps: currentDrama.eps, points, date: new Date().toLocaleDateString() };
        if(idx > -1) db[idx] = data; else db.unshift(data);
        localStorage.setItem(`db_${user.n}`, JSON.stringify(db));
        alert("영수증이 보관함에 기록되었습니다."); loadArchive();
    }

    function loadArchive() {
        const db = JSON.parse(localStorage.getItem(`db_${user.n}`)) || [];
        const list = document.getElementById('archive-list');
        list.innerHTML = db.map(i => `<div class="archive-item" onclick="initCanvas('${i.title}', ${i.eps}, [${i.points}])">
            <b>${i.title}</b> <span style="float:right; font-size:0.6rem;">${i.date}</span>
        </div>`).join('') || "기록이 없습니다.";
    }

    function toggleArchive() { 
        const l = document.getElementById('archive-list'); 
        l.style.display = l.style.display === 'none' ? 'block' : 'none'; 
    }
    function logout() { localStorage.removeItem('dl_u'); location.reload(); }
    function logout() { localStorage.removeItem('dl_u'); location.reload(); }
</script>
</body>
</html>
