<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drama Line: Dragon Assembly</title>
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #e5e7eb; --receipt: #fdfdfb; --ink: #1a1a1a; --red: #ff4b4b; --guide: #cbd5e1; }
        body { font-family: 'Courier Prime', 'Noto Sans KR', sans-serif; background: var(--bg); display: flex; flex-direction: column; align-items: center; padding: 20px; margin: 0; color: var(--ink); }
        
        .receipt { width: 100%; max-width: 500px; background: var(--receipt); padding: 40px 25px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); position: relative; clip-path: polygon(0% 1%, 5% 0%, 10% 1%, 15% 0%, 20% 1%, 25% 0%, 30% 1%, 35% 0%, 40% 1%, 45% 0%, 50% 1%, 55% 0%, 60% 1%, 65% 0%, 70% 1%, 75% 0%, 80% 1%, 85% 0%, 90% 1%, 95% 0%, 100% 1%, 100% 99%, 95% 100%, 90% 99%, 85% 100%, 80% 99%, 75% 100%, 70% 99%, 65% 100%, 60% 99%, 55% 100%, 50% 99%, 45% 100%, 40% 99%, 35% 100%, 30% 99%, 25% 100%, 20% 99%, 15% 100%, 10% 99%, 5% 100%, 0% 99%); }
        .header { text-align: center; border-bottom: 2px dashed #ccc; padding-bottom: 15px; margin-bottom: 20px; }
        input { width: 100%; border: none; border-bottom: 1px solid #ddd; background: transparent; padding: 10px 0; font-family: inherit; outline: none; margin-bottom: 15px; font-size: 1.1rem; font-weight: bold; }

        /* 용 조립 영역: 가로로 꽉 차게 배치 */
        .dragon-assembly { display: flex; width: 100%; height: 180px; background: #fff; margin: 25px 0; cursor: pointer; border: 1px solid #eee; overflow: hidden; }
        .part-box { flex: 1; position: relative; display: flex; align-items: center; justify-content: center; transition: background 0.2s; border-right: 1px dotted #eee; }
        .part-box:last-child { border-right: none; }
        .part-box:hover { background: #f8fafc; }

        /* 이미지 스타일: 가로로 자연스럽게 연결 */
        .dragon-img { width: 100%; height: 100%; object-fit: contain; pointer-events: none; }
        
        .level-tag { position: absolute; top: 5px; right: 5px; font-size: 0.6rem; font-weight: bold; padding: 2px 5px; background: var(--ink); color: #fff; border-radius: 3px; z-index: 2; }
        .part-label { position: absolute; bottom: 5px; font-size: 0.6rem; color: #bbb; z-index: 2; }

        /* 결과 도장 */
        #verdict-area { text-align: center; margin-top: 30px; padding-top: 20px; border-top: 2px dashed #ccc; }
        .verdict-stamp { font-size: 1.5rem; font-weight: bold; color: var(--red); border: 4px double var(--red); padding: 10px 20px; display: inline-block; transform: rotate(-8deg); letter-spacing: 2px; }

        .btn { background: var(--ink); color: white; border: none; padding: 15px; cursor: pointer; font-family: inherit; width: 100%; font-weight: bold; margin-top: 20px; }
    </style>
</head>
<body>

<div class="receipt">
    <div class="header">
        <h1>DRAMA LINE</h1>
        <p style="font-size: 0.6rem;">TAB TO ASSEMBLE YOUR DRAGON</p>
    </div>

    <input type="text" placeholder="드라마 제목을 입력하세요" oninput="updateVerdict()">
    
    <div style="display: flex; justify-content: space-between; font-size: 0.7rem; margin-bottom: 5px;">
        <span>CRITIC: <b>[닉네임]</b></span>
        <span id="date">2026.04.25</span>
    </div>

    <div class="dragon-assembly">
        <div class="part-box" onclick="cycle('p1')">
            <span class="level-tag" id="p1-tag">상</span>
            <img id="p1-img" class="dragon-img" src="" alt="Tail">
            <span class="part-label">초반(꼬리)</span>
        </div>
        <div class="part-box" onclick="cycle('p2')">
            <span class="level-tag" id="p2-tag">상</span>
            <img id="p2-img" class="dragon-img" src="" alt="Body">
            <span class="part-label">중반(몸통)</span>
        </div>
        <div class="part-box" onclick="cycle('p3')">
            <span class="level-tag" id="p3-tag">상</span>
            <img id="p3-img" class="dragon-img" src="" alt="Head">
            <span class="part-label">결말(얼굴)</span>
        </div>
    </div>

    <div id="verdict-area">
        <div class="verdict-stamp" id="verdict-text">판독중</div>
    </div>

    <button class="btn">영수증 발행 및 저장</button>
</div>

<script>
    // 9개 분할 이미지 데이터 (편의를 위해 개별 캔버스 추출 로직 대체)
    // 실제 활용시 아래 주소에 분할된 9개의 PNG 파일 경로를 넣으시면 됩니다.
    const assets = {
        p1: ["tail_high.png", "tail_mid.png", "tail_low.png"], // 꼬리 상중하
        p2: ["body_high.png", "body_mid.png", "body_low.png"], // 몸통 상중하
        p3: ["head_high.png", "head_mid.png", "head_low.png"]  // 얼굴 상중하
    };

    const state = { p1: 0, p2: 0, p3: 0 };
    const labels = ["상", "중", "하"];

    function cycle(part) {
        state[part] = (state[part] + 1) % 3;
        render();
    }

    function render() {
        ['p1', 'p2', 'p3'].forEach(p => {
            document.getElementById(`${p}-tag`).innerText = labels[state[p]];
            // 이미지 소스 업데이트 (현재는 시뮬레이션을 위해 이미지 태그에 스타일 부여)
            // 실제 이미지 파일이 준비되면 src 속성을 assets[p][state[p]]로 연결하세요.
            const img = document.getElementById(`${p}-img`);
            img.style.opacity = state[p] === 0 ? "1" : state[p] === 1 ? "0.7" : "0.4";
        });
        updateVerdict();
    }

    function updateVerdict() {
        const p1 = state.p1, p3 = state.p3;
        let res = "평범무난";
        if(p1 === 0 && p3 === 0) res = "용두용미";
        else if(p1 === 0 && p3 === 2) res = "용두사미";
        else if(p1 === 2 && p3 === 0) res = "사두용미";
        else if(p1 === 2 && p3 === 2) res = "사두사미";
        document.getElementById('verdict-text').innerText = res;
    }

    render();
</script>
</body>
</html>
