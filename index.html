<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drama Line: Dragon Loop</title>
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #e5e7eb; --receipt: #fdfdfb; --ink: #1a1a1a; --red: #ff4b4b; }
        body { font-family: 'Courier Prime', 'Noto Sans KR', sans-serif; background: var(--bg); display: flex; flex-direction: column; align-items: center; padding: 20px; margin: 0; }
        
        .receipt { width: 100%; max-width: 450px; background: var(--receipt); padding: 40px 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); position: relative; clip-path: polygon(0% 1%, 5% 0%, 10% 1%, 15% 0%, 20% 1%, 25% 0%, 30% 1%, 35% 0%, 40% 1%, 45% 0%, 50% 1%, 55% 0%, 60% 1%, 65% 0%, 70% 1%, 75% 0%, 80% 1%, 85% 0%, 90% 1%, 95% 0%, 100% 1%, 100% 99%, 95% 100%, 90% 99%, 85% 100%, 80% 99%, 75% 100%, 70% 99%, 65% 100%, 60% 99%, 55% 100%, 50% 99%, 45% 100%, 40% 99%, 35% 100%, 30% 99%, 25% 100%, 20% 99%, 15% 100%, 10% 99%, 5% 100%, 0% 99%); }
        
        .header { text-align: center; border-bottom: 2px dashed #ccc; padding-bottom: 15px; margin-bottom: 20px; }
        .info-row { display: flex; justify-content: space-between; font-size: 0.7rem; margin-bottom: 10px; }
        
        /* 드래곤 조립 영역 */
        .dragon-assembly { display: flex; width: 100%; height: 150px; border: 1px solid #eee; background: #fff; margin: 20px 0; cursor: pointer; }
        .part-box { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; border-right: 1px dotted #eee; position: relative; overflow: hidden; transition: background 0.2s; }
        .part-box:last-child { border-right: none; }
        .part-box:hover { background: #fcfcfc; }
        
        /* 작화 레벨 표시 */
        .level-tag { position: absolute; top: 5px; font-size: 0.6rem; font-weight: bold; padding: 2px 5px; background: var(--ink); color: #fff; border-radius: 3px; }
        .part-label { position: absolute; bottom: 5px; font-size: 0.6rem; color: #aaa; }

        /* 가짜 작화 이미지 대체 (텍스트/이모지) */
        .dragon-img { font-size: 3rem; filter: grayscale(1); }
        .level-high { filter: grayscale(0) drop-shadow(0 0 2px gold); }
        .level-low { opacity: 0.3; transform: scale(0.8) rotate(10deg); }

        .verdict-stamp { display: none; text-align: center; margin-top: 20px; font-weight: bold; color: var(--red); border: 3px double var(--red); padding: 10px; transform: rotate(-5deg); font-size: 1.2rem; }
        .btn { background: var(--ink); color: white; border: none; padding: 15px; cursor: pointer; font-family: inherit; width: 100%; font-weight: bold; margin-top: 20px; }
        input { width: 100%; border: none; border-bottom: 1px solid #ddd; background: transparent; padding: 10px 0; font-family: inherit; outline: none; margin-bottom: 10px; }
    </style>
</head>
<body>

<div class="receipt">
    <div class="header">
        <h1>DRAMA LINE</h1>
        <p style="font-size: 0.6rem;">CLICK TO EVOLVE YOUR DRAGON</p>
    </div>

    <div id="main-ui">
        <input type="text" id="drama-title" placeholder="ENTER DRAMA TITLE...">
        <div class="info-row">
            <span>CRITIC: <b id="user-name">USER</b></span>
            <span id="curr-date">2026.04.25</span>
        </div>

        <div class="dragon-assembly">
            <div class="part-box" onclick="cyclePart('p1')">
                <span class="level-tag" id="p1-tag">상</span>
                <span class="dragon-img" id="p1-img">🐉</span>
                <span class="part-label">초반: 꼬리</span>
            </div>
            <div class="part-box" onclick="cyclePart('p2')">
                <span class="level-tag" id="p2-tag">상</span>
                <span class="dragon-img" id="p2-img">🦴</span>
                <span class="part-label">중반: 몸통</span>
            </div>
            <div class="part-box" onclick="cyclePart('p3')">
                <span class="level-tag" id="p3-tag">상</span>
                <span class="dragon-img" id="p3-img">🐲</span>
                <span class="part-label">결말: 얼굴</span>
            </div>
        </div>

        <div id="verdict-stamp" class="verdict-stamp">용두용미</div>
        
        <button class="btn" onclick="saveReceipt()">PRINT & SAVE</button>
    </div>
</div>

<script>
    // 상태 관리
    const levels = ['상', '중', '하'];
    const state = {
        p1: 0, // 꼬리
        p2: 0, // 몸통
        p3: 0  // 얼굴
    };

    const visuals = {
        p1: ['🐉', '🦎', '🪱'], // 꼬리: 고퀄용꼬리, 도마뱀꼬리, 지렁이
        p2: ['🦴', '🍖', '🥓'], // 몸통: 튼튼한뼈대, 평범고기, 베이컨한줄
        p3: ['🐲', '🦖', '🐶']  // 얼굴: 위엄있는용, 공룡, 댕댕이
    };

    function cyclePart(part) {
        // 0(상) -> 1(중) -> 2(하) -> 다시 0(상) 순환
        state[part] = (state[part] + 1) % 3;
        updateUI();
    }

    function updateUI() {
        ['p1', 'p2', 'p3'].forEach(part => {
            const levelIdx = state[part];
            const tag = document.getElementById(`${part}-tag`);
            const img = document.getElementById(`${part}-img`);
            
            tag.innerText = levels[levelIdx];
            img.innerText = visuals[part][levelIdx];

            // 시각적 퀄리티 차이 부여
            img.style.filter = levelIdx === 0 ? "grayscale(0) contrast(1.2)" : 
                               levelIdx === 1 ? "grayscale(0.5)" : 
                               "grayscale(1) opacity(0.5) blur(1px)";
        });

        calculateVerdict();
    }

    function calculateVerdict() {
        const p1 = state[p1_idx = 'p1']; // 실제로는 state.p1
        const p3 = state[p3_idx = 'p3'];
        
        let result = "";
        const stamp = document.getElementById('verdict-stamp');

        // 초반(p1)과 결말(p3) 비교 (0:상, 2:하)
        if (state.p1 === 0 && state.p3 === 0) result = "용두용미 (LEGEND)";
        else if (state.p1 === 0 && state.p3 === 2) result = "용두사미 (SCAM)";
        else if (state.p1 === 2 && state.p3 === 0) result = "사두용미 (MIRACLE)";
        else if (state.p1 === 2 && state.p3 === 2) result = "사두사미 (FLOP)";
        else result = "평범무난 (SO-SO)";

        stamp.innerText = result;
        stamp.style.display = 'block';
    }

    function saveReceipt() {
        const title = document.getElementById('drama-title').value || "UNTITLED";
        alert(`'${title}' 영수증이 발행되었습니다!\n상태: ${levels[state.p1]}-${levels[state.p2]}-${levels[state.p3]}`);
        // 실제 저장 로직 추가 가능
    }

    // 초기 날짜 설정
    document.getElementById('curr-date').innerText = new Date().toLocaleDateString();
</script>
</body>
</html>
